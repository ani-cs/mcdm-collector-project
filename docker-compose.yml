services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mcdm_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    extra_hosts:
      # Lets the backend reach the local demo Supabase stack (started via
      # `npx supabase start`, which runs outside this compose project) at
      # SUPABASE_URL=http://host.docker.internal:54321. Docker Desktop
      # (Windows/Mac) resolves this automatically; this entry makes it work
      # on Linux too.
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: mcdm_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
