services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mcdm_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app

  frontend:
    build: ./frontend
    container_name: mcdm_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
